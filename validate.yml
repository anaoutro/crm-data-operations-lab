name: Validate research pipeline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test duplicate handling and CRM gate
        working-directory: fieldwork
        run: python -m unittest -v
      - name: Build public account draft
        working-directory: public-b2b-seven
        run: python lead_ops.py source_accounts.csv generated
